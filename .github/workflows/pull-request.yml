name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Deny everything by default. Each job asks for exactly what it needs.
permissions: {}

# A new push cancels the older run for the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f compose/docker-compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start the stack and wait until healthy
        run: $COMPOSE up -d --build --wait --wait-timeout 90

      - name: Smoke test readiness
        run: bash tests/reliable-smoke-test.sh http://localhost:8080/ready

      - name: Vote round trip
        run: |
          curl -fsS -o /dev/null -X POST -d vote=a http://localhost:8080/
          votes=$($COMPOSE exec -T redis redis-cli llen votes | tr -d '\r\n ')
          echo "votes in redis: $votes"
          test "$votes" = "1"

      - name: Failure check, readiness must fail when Redis is down
        run: |
          $COMPOSE stop redis
          set +e
          MAX_TOTAL=20 bash tests/reliable-smoke-test.sh http://localhost:8080/ready
          rc=$?
          set -e
          echo "smoke test exit code with Redis down: $rc"
          test "$rc" -eq 11

      - name: Collect logs
        if: always()
        run: |
          mkdir -p smoke-artifacts
          $COMPOSE logs --no-color > smoke-artifacts/compose.log 2>&1 || true
          $COMPOSE ps -a > smoke-artifacts/compose-ps.txt 2>&1 || true

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          retention-days: 7
          if-no-files-found: ignore
